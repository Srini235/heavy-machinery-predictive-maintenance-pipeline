name: Predictive Maintenance CI

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-notebook.txt -r requirements-api.txt
        pip install httpx flake8 black isort

    - name: Lint gates
      run: |
        flake8 --max-line-length=100 src tests api_server.py train_and_save.py
        black --check --line-length 100 src tests api_server.py train_and_save.py
        isort --check-only --profile black --line-length 100 src tests api_server.py train_and_save.py

    - name: Train models (required by API integration tests)
      run: |
        python train_and_save.py

    - name: Run test suite
      run: |
        python -m pytest tests/ -q
