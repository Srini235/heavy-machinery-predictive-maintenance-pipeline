[pytest]
; Test classification taxonomy (QA feedback): run any class in isolation with
;   pytest -m <marker>          e.g.  pytest -m ml_inference -q
markers =
    unit: isolated tests of a single function/class (no I/O beyond tmp dirs)
    integration: tests exercising the real FastAPI app + trained artifacts end-to-end
    ml_training: tests of the training procedure itself (overfit, loss curve, baseline)
    ml_inference: tests of trained-model inference behaviour (shape, range, invariance, directional)
    data_quality: dataset validation tests (schema, missing values, drift)
    rag: retrieval-augmented maintenance-advisor tests
    idempotency: reproducibility tests (same seed -> same artifacts/predictions)
    performance: time/space complexity tests (latency, memory, artifact size)
addopts = -ra
